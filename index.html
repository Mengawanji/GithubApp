<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="auth">
            <div class="profile"><img src="Image/git-logo.png" alt=""></div>
            <h2>Github </h2>
            <div class="display">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="gitName"  placeholder="Enter Github Username">
                <div class="error" id="userError"> </div>
            </div>
            <button> Search </button> 
        </div>
        <div class="card">
            <div class="avatar">
                <img src="https://unsplash.it/200/200" alt="">
            </div>
            <div class="info">
                <h2>Profile Name</h2>
                <p>profile_username</p>
                <div class="follow-info">
                    <div class="single">
                        <span>123</span>
                        <span>Followers</span>
                    </div>
                    <div class="single">
                        <span>123</span>
                        <span>Following</span>
                    </div>
                </div>
                <div class="single">
                    <span>123</span>
                    <span>Repos</span>
                </div>
            </div>
            <a href="/">Visit Github Profile ></a>
        </div>
        <div class="repos">
            <div class="card">
                <h2>Repo Name</h2>
                <a href="/">Take a look at this repo ></a>
            </div>
        </div> 
    </div>
    </div>
    


    <script src="script.js"></script>
</body>
</html>
